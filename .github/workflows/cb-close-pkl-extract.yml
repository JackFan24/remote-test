name: cb-close-pkl-extract
on:
  push:
    paths: ['.github/workflows/cb-close-pkl-extract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone public CB dataset and extract JSL-style history factors
        shell: bash
        run: |
          python -m pip install -q --disable-pip-version-check pandas
          git clone --depth 1 https://github.com/reskfa/cb_with_any_api.git repo
          python - <<'PY'
          import os,re
          import pandas as pd
          os.makedirs('factor_extract',exist_ok=True)
          TARGET_CODES=set('''100009,100016,100087,100096,100117,100177,100196,100220,100236,100567,100726,100795,110001,110002,110003,110004,110005,110006,110007,110008,110009,110010,110011,110012,110013,110015,110016,110017,110018,110019,110020,110021,110022,110023,110024,110025,110026,110027,110028,110029,110030,110031,110032,110033,110034,110035,110036,110037,110038,110039,110040,110078,110219,110227,110232,110317,110325,110368,110398,110418,110423,110488,110567,110598,110874,110971,113001,113002,113003,113005,113006,113007,113008,113009,113010,113011,113012,113013,113014,113015,113016,113501,113502,123001,123002,125002,125024,125069,125089,125302,125488,125528,125572,125629,125630,125709,125729,125731,125822,125887,125930,125932,125936,125937,125959,125960,125969,126002,126301,126630,126729,127001,127002,127003,127004,128001,128002,128003,128004,128005,128006,128007,128008,128009,128010,128011,128012,128013,128014,128015,128016,128017,128018,128019,128020,128021,128022,128023,128025,128031,128233,129031'''.split(','))
          keys=['Close','Amt','ConvV','ConvPrem','Outstanding','YTM','Ptm']
          def parse_dates(idx):
              s=pd.Series(idx,dtype='object').astype(str).str.replace(r'\.0$','',regex=True).str.strip()
              print('RAW_INDEX_HEAD',s.head(8).tolist(),'RAW_INDEX_TAIL',s.tail(8).tolist(),flush=True)
              is8=s.str.fullmatch(r'\d{8}').mean()
              if is8>0.8:
                  return pd.DatetimeIndex(pd.to_datetime(s,format='%Y%m%d',errors='coerce'))
              # try YYYY-MM-DD-like strings first
              d=pd.to_datetime(s,errors='coerce')
              # fallback for Excel serial dates if most failed
              if d.notna().mean()<0.5:
                  n=pd.to_numeric(s,errors='coerce')
                  d=pd.to_datetime(n,unit='D',origin='1899-12-30',errors='coerce')
              return pd.DatetimeIndex(d)
          longs=[]; summary=[]
          for key in keys:
              x=pd.read_pickle(f'repo/data/{key}.pkl')
              print('MATRIX',key,'TYPE',type(x).__name__,'SHAPE',x.shape,'INDEXTYPE',type(x.index).__name__,'COLHEAD',[str(c) for c in x.columns[:5]],flush=True)
              x=x.copy(); x.index=parse_dates(x.index)
              x=x.loc[x.index.notna()]
              x=x.loc[(x.index>=pd.Timestamp('2002-01-01'))&(x.index<=pd.Timestamp('2017-12-29'))]
              keep=[]; code_map={}
              for c in x.columns:
                  s=str(c); m=re.search(r'(?<!\d)(\d{6})(?!\d)',s)
                  code=m.group(1) if m else (''.join(ch for ch in s if ch.isdigit())[:6] or None)
                  if code in TARGET_CODES:
                      keep.append(c); code_map[c]=code
              st=x[keep].stack().rename(key).reset_index()
              st.columns=['date','raw_col',key]
              st['code']=st['raw_col'].map(code_map)
              st=st[['date','code',key]]
              longs.append(st)
              rec={'key':key,'shape_rows':len(x),'shape_cols_all':x.shape[1],'target_cols':len(keep),'nonnull_target':len(st),'date_min':x.index.min().strftime('%Y-%m-%d') if len(x) else '','date_max':x.index.max().strftime('%Y-%m-%d') if len(x) else ''}
              summary.append(rec); print(key,rec,flush=True)
          out=longs[0]
          for z in longs[1:]: out=out.merge(z,on=['date','code'],how='outer',validate='one_to_one')
          out=out.sort_values(['date','code']); out['date']=pd.to_datetime(out['date']).dt.strftime('%Y-%m-%d')
          out.to_csv('factor_extract/historical_factors_2002_2017.csv.gz',index=False,encoding='utf-8-sig',compression='gzip')
          pd.DataFrame(summary).to_csv('factor_extract/matrix_summary.csv',index=False,encoding='utf-8-sig')
          out.groupby('date')[keys].count().reset_index().to_csv('factor_extract/daily_field_coverage.csv',index=False,encoding='utf-8-sig')
          print('OUT_ROWS',len(out),'DATE_RANGE',out['date'].min() if len(out) else '',out['date'].max() if len(out) else '','OUT_CODE_COUNT',out['code'].nunique() if len(out) else 0,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cb-jsl-history-factors
          path: factor_extract/
