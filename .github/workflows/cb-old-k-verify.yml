name: cb-old-k-verify

on:
  push:
    paths:
      - '.github/workflows/cb-old-k-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-old-cb-k:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnose FTShare legacy convertible bonds
        shell: bash
        run: |
          cat > /tmp/diag.py <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError

          BASE='https://market.ft.tech/gateway/'
          KURL=BASE+'api/v1/market/data/convertible-bond-candlesticks'
          SH=timezone(timedelta(hours=8))
          os.makedirs('cb_diag', exist_ok=True)

          def ms(y,m,d): return int(datetime(y,m,d,23,59,59,tzinfo=SH).timestamp()*1000)
          def request(method,url,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=Request(url,data=data,headers={'Content-Type':'application/json','Accept':'application/json'},method=method)
              try:
                  with urlopen(req,timeout=45) as r: return r.status,r.read().decode('utf-8','replace')
              except HTTPError as e: return e.code,e.read().decode('utf-8','replace')
              except Exception as e: return -1,json.dumps({'exception':type(e).__name__,'message':str(e)},ensure_ascii=False)

          tests=[
            ('110003_last50',{'symbol':'110003.SH','interval_unit':'day','adjust_kind':'none','until_ts_millis':ms(2013,8,6),'limit':50}),
            ('113001_last50',{'symbol':'113001.SH','interval_unit':'day','adjust_kind':'none','until_ts_millis':ms(2015,3,6),'limit':50}),
            ('113027_active',{'symbol':'113027.SH','interval_unit':'day','adjust_kind':'none','until_ts_millis':ms(2024,6,6),'limit':2}),
            ('125731_last50',{'symbol':'125731.SZ','interval_unit':'day','adjust_kind':'none','until_ts_millis':ms(2013,4,12),'limit':50}),
            ('112731_try',{'symbol':'112731.SZ','interval_unit':'day','adjust_kind':'none','until_ts_millis':ms(2013,4,12),'limit':50}),
          ]
          summary=[]
          for name,body in tests:
              st,raw=request('POST',KURL,body)
              open(f'cb_diag/{name}.json','w',encoding='utf-8').write(raw)
              try: obj=json.loads(raw)
              except: obj={}
              data=obj.get('data') if isinstance(obj,dict) else None
              summary.append({'name':name,'http_status':st,'code':obj.get('code') if isinstance(obj,dict) else None,'message':obj.get('message') if isinstance(obj,dict) else None,'data_len':len(data) if isinstance(data,list) else None})

          for code in ['110003','113001','125731','112731']:
              url=BASE+'api/v1/market/data/cb/cb-base-data?'+urlencode({'symbol_code':code})
              st,raw=request('GET',url)
              open(f'cb_diag/base_{code}.json','w',encoding='utf-8').write(raw)
              try: obj=json.loads(raw)
              except: obj={}
              summary.append({'name':'base_'+code,'http_status':st,'code':obj.get('code') if isinstance(obj,dict) else None,'message':obj.get('message') if isinstance(obj,dict) else None,'data_preview':str(obj.get('data'))[:500] if isinstance(obj,dict) else ''})

          print(json.dumps(summary,ensure_ascii=False,indent=2))
          open('cb_diag/summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/diag.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-old-k-diagnose
          path: cb_diag/
          if-no-files-found: warn
