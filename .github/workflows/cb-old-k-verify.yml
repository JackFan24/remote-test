name: cb-old-k-verify

on:
  push:
    paths:
      - '.github/workflows/cb-old-k-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck-akshare-sina:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install AKShare
        run: python -m pip install -q --disable-pip-version-check akshare

      - name: Fetch three legacy CB daily histories from Sina via AKShare
        shell: bash
        run: |
          cat > /tmp/cross.py <<'PY'
          import json, os, traceback
          import pandas as pd
          import akshare as ak

          os.makedirs('cb_cross', exist_ok=True)
          anchors={'sh110003':102.16,'sz125731':109.197,'sh113001':94.72}
          summary=[]
          for symbol, expected in anchors.items():
              try:
                  df=ak.bond_zh_hs_cov_daily(symbol=symbol)
                  if df is None: df=pd.DataFrame()
                  df.to_csv(f'cb_cross/{symbol}.csv',index=False,encoding='utf-8-sig')
                  cols=[str(c) for c in df.columns]
                  date_col=next((c for c in df.columns if str(c).lower() in ('date','日期','trade_date')),None)
                  close_col=next((c for c in df.columns if str(c).lower() in ('close','收盘','收盘价')),None)
                  anchor=None
                  if date_col is not None and close_col is not None and not df.empty:
                      dates=pd.to_datetime(df[date_col],errors='coerce').dt.strftime('%Y-%m-%d')
                      hit=df.loc[dates=='2012-03-30',close_col]
                      if len(hit): anchor=float(hit.iloc[0])
                  summary.append({'symbol':symbol,'ok':True,'rows':len(df),'columns':cols,'first':str(df.iloc[0].to_dict())[:500] if len(df) else None,'last':str(df.iloc[-1].to_dict())[:500] if len(df) else None,'anchor':anchor,'expected':expected})
              except Exception as e:
                  summary.append({'symbol':symbol,'ok':False,'error':repr(e),'trace':traceback.format_exc()[-1500:]})
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          open('cb_cross/summary.json','w',encoding='utf-8').write(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python /tmp/cross.py

      - name: Upload crosscheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-akshare-sina-crosscheck
          path: cb_cross/
          if-no-files-found: warn
