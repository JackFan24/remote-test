name: cb-old-k-verify

on:
  push:
    paths:
      - '.github/workflows/cb-old-k-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enumerate-ftshare-cb-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch FTShare CB list and historical base metadata
        shell: bash
        run: |
          cat > /tmp/universe.py <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError

          BASE='https://market.ft.tech/gateway/api/v1/market/data/cb/'
          os.makedirs('cb_universe',exist_ok=True)
          def get(url):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
              try:
                  with urlopen(req,timeout=30) as r:return r.status,r.read().decode('utf-8','replace')
              except HTTPError as e:return e.code,e.read().decode('utf-8','replace')
              except Exception as e:return -1,json.dumps({'exception':type(e).__name__,'message':str(e)},ensure_ascii=False)

          st,raw=get(BASE+'cb-lists')
          open('cb_universe/cb_lists_raw.json','w',encoding='utf-8').write(raw)
          try: obj=json.loads(raw)
          except: obj={}
          data=obj.get('data') if isinstance(obj,dict) else None
          print('LIST_STATUS',st,'LIST_TYPE',type(data).__name__,'LIST_N',len(data) if isinstance(data,list) else None,flush=True)
          if isinstance(data,list):
              print('LIST_FIRST',json.dumps(data[:5],ensure_ascii=False),flush=True)
              print('LIST_LAST',json.dumps(data[-5:],ensure_ascii=False),flush=True)
          rows=[]
          # If list is reasonably sized, inspect every code's base metadata and filter historical 2015-2017 overlap.
          if isinstance(data,list):
              for i,r in enumerate(data,1):
                  code=r.get('cb_id') if isinstance(r,dict) else None
                  if code is None: continue
                  s,txt=get(BASE+'cb-base-data?'+urlencode({'symbol_code':str(code)}))
                  try:o=json.loads(txt); b=o.get('data') if isinstance(o,dict) else None
                  except:b=None
                  if isinstance(b,dict):
                      rec=dict(b); rec['_status']=s; rows.append(rec)
                  if i%25==0: print('BASE_PROGRESS',i,'/',len(data),flush=True)
                  time.sleep(0.08)
          open('cb_universe/base_all.json','w',encoding='utf-8').write(json.dumps(rows,ensure_ascii=False,indent=2))
          cand=[]
          for b in rows:
              ld=b.get('listed_date'); stop=b.get('stop_trading_date') or b.get('de_listed_date') or 99999999
              try: ld=int(ld) if ld else 99999999; stop=int(stop) if stop else 99999999
              except: continue
              if ld<=20171229 and stop>=20150625:
                  cand.append(b)
          open('cb_universe/candidates_2015_2017.json','w',encoding='utf-8').write(json.dumps(cand,ensure_ascii=False,indent=2))
          print('BASE_ROWS',len(rows),'CANDIDATES_2015_2017',len(cand),flush=True)
          for b in cand:
              print('CAND',b.get('cb_id'),b.get('cb_name'),b.get('listed_date'),b.get('stop_trading_date'),b.get('de_listed_date'),b.get('exchange'),flush=True)
          PY
          python /tmp/universe.py

      - name: Upload universe metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-ftshare-universe
          path: cb_universe/
          if-no-files-found: warn
