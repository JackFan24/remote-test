name: fnz-ccer-101968-preview

on:
  push:
    paths:
      - '.github/workflows/fnz-ccer-101968-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query official CCER anonymous preview for 101968
        shell: bash
        run: |
          mkdir -p ccer_101968
          python - <<'PY'
          import json,re,requests
          base='https://www.ccerdata.cn'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          s.get(base+'/login?target=/database',timeout=30)
          text=s.get(base+'/js/login.js',timeout=30).text
          m=re.search(r'postnologin=function\(\).*?post\(["\'](/login/signin)["\'],\{User:["\']([^"\']+)["\'],Password:["\']([^"\']+)["\']\}',text,re.S)
          endpoint,user,pwd=m.groups()
          s.post(base+endpoint,data={'User':user,'Password':pwd},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
          fields=['9028001','9028002','9028004','9028014','9028019','9028020','9028025','9028028','9028030','9028031','9028032','9028033']
          conditions=[
            {'fieldId':'9028019','type':'DateRange','data':{'min':20010830,'max':20011231}},
            {'relation':'and','rules':[{'fieldId':'9028002','type':'eq','data':'101968'}],'groups':[]}
          ]
          payload={'libraryId':'9012','subLibraryId':'901201','viewId':'9028','fields':fields,'conditions':conditions,'join':[]}
          r=s.get(base+'/product/preview',params={'data':json.dumps(payload,separators=(',',':')),'page':1,'rows':100},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
          print('HTTP',r.status_code,'BODY',r.text[:20000].replace('\n',' '),flush=True)
          open('ccer_101968/raw.json','w',encoding='utf-8').write(r.text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-ccer-101968-preview
          path: ccer_101968/
