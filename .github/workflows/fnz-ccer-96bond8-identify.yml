name: fnz-ccer-96bond8-identify

on:
  push:
    paths:
      - '.github/workflows/fnz-ccer-96bond8-identify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public Pinggu thread metadata only
        shell: bash
        run: |
          python - <<'PY'
          import requests,re,html
          urls=[
            'https://bbs.pinggu.org/thread-396506-1-1.html',
            'http://bbs.pinggu.org/thread-396506-1-1.html',
            'https://bbs.pinggu.org/jg/shuju_shujuku_396506_1.html'
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          for u in urls:
            try:
              r=s.get(u,timeout=30,allow_redirects=True)
              t=r.text
              print('\nURL',u,'HTTP',r.status_code,'FINAL',r.url,'BYTES',len(r.content),flush=True)
              title=re.search(r'<title>(.*?)</title>',t,re.I|re.S)
              if title: print('TITLE',re.sub('<[^>]+>','',html.unescape(title.group(1))).strip(),flush=True)
              plain=re.sub(r'<script.*?</script>|<style.*?</style>',' ',t,flags=re.I|re.S)
              plain=re.sub(r'<[^>]+>',' ',plain)
              plain=html.unescape(re.sub(r'\s+',' ',plain))
              for needle in ['资料名称','文件格式','文件数','附件','rar','国债现货','交易数据库','下载','2008']:
                for m in list(re.finditer(needle,plain,re.I))[:12]:
                  print('TEXT',needle,plain[max(0,m.start()-500):m.end()+1000],flush=True)
              # Public attachment/link metadata only; do not follow or download attachments.
              for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',t,re.I|re.S):
                lab=re.sub('<[^>]+>',' ',label); lab=html.unescape(re.sub(r'\s+',' ',lab)).strip()
                h=html.unescape(href)
                if any(k in (h+' '+lab).lower() for k in ['attach','rar','download','396506']) or '国债' in lab:
                  print('LINK_META',lab[:300],h[:1000],flush=True)
            except Exception as e: print('ERR',u,repr(e),flush=True)
          PY
