name: fnz-ccer-96bond8-identify

on:
  push:
    paths:
      - '.github/workflows/fnz-ccer-96bond8-identify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query target bond by intrinsic identifiers
        shell: bash
        run: |
          mkdir -p ccer_96bond8_identify
          python - <<'PY'
          import json,re,requests
          base='https://www.ccerdata.cn'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          s.get(base+'/login?target=/database',timeout=30)
          text=s.get(base+'/js/login.js',timeout=30).text
          m=re.search(r'postnologin=function\(\).*?post\(["\'](/login/signin)["\'],\{User:["\']([^"\']+)["\'],Password:["\']([^"\']+)["\']\}',text,re.S)
          endpoint,user,pwd=m.groups()
          s.post(base+endpoint,data={'User':user,'Password':pwd},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
          fields=['9028001','9028002','9028003','9028004','9028006','9028014','9028019','9028020','9028025','9028028']
          base_date={'fieldId':'9028019','type':'DateRange','data':{'min':20010830,'max':20011231}}
          probes=[
            ('unique_id',{'fieldId':'9028001','type':'eq','data':'20031101.208560'}),
            ('maturity',{'fieldId':'9028006','type':'eq','data':'20031101'}),
            ('abbr96',{'fieldId':'9028004','type':'cn','data':'96'})
          ]
          for label,rule in probes:
              conditions=[base_date,{'relation':'and','rules':[rule],'groups':[]}]
              payload={'libraryId':'9012','subLibraryId':'901201','viewId':'9028','fields':fields,'conditions':conditions,'join':[]}
              r=s.get(base+'/product/preview',params={'data':json.dumps(payload,separators=(',',':')),'page':1,'rows':100},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
              print('\nPROBE',label,'HTTP',r.status_code,'BODY',r.text[:12000].replace('\n',' '),flush=True)
              open(f'ccer_96bond8_identify/{label}.json','w',encoding='utf-8').write(r.text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-ccer-96bond8-identify
          path: ccer_96bond8_identify/
