name: fnz-ccer-eight-missing-check

on:
  push:
    paths:
      - '.github/workflows/fnz-ccer-eight-missing-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query total only for eight candidate missing pairs
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          base='https://www.ccerdata.cn'
          pairs=[
            ('009704',20010904),
            ('009908',20010921),
            ('010107',20020130),
            ('010103',20020423),
            ('010107',20020730),
            ('009905',20020819),
            ('009704',20020904),
            ('009908',20020920),
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          s.get(base+'/login?target=/database',timeout=30)
          text=s.get(base+'/js/login.js',timeout=30).text
          m=re.search(r'postnologin=function\(\).*?post\(["\'](/login/signin)["\'],\{User:["\']([^"\']+)["\'],Password:["\']([^"\']+)["\']\}',text,re.S)
          endpoint,user,pwd=m.groups()
          s.post(base+endpoint,data={'User':user,'Password':pwd},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
          for code,d in pairs:
              cond=[{'fieldId':'9028019','type':'DateRange','data':{'min':d,'max':d}}, {'relation':'and','rules':[{'fieldId':'9028002','type':'eq','data':code}],'groups':[]}]
              payload={'libraryId':'9012','subLibraryId':'901201','viewId':'9028','fields':['9028002','9028004','9028019'],'conditions':cond,'join':[]}
              r=s.get(base+'/product/preview',params={'data':json.dumps(payload,separators=(',',':')),'page':1,'rows':1},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
              print('PAIR',code,d,'TOTAL',r.json().get('total'),flush=True)
          PY
