name: fnz-ccer-querycondition-js-v2

on:
  push:
    paths:
      - '.github/workflows/fnz-ccer-querycondition-js-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public CCER query condition JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import requests,re
          urls=[
            'https://www.ccerdata.cn/js/dap.queryCondition.js?v=OLG1TikiKCJHJmK2czjfD-doyRVaYHr4qH95RPDW7RE',
            'https://www.ccerdata.cn/js/dap.queryCondition.js'
          ]
          text=''
          for u in urls:
            try:
              r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
              print('URL',u,'HTTP',r.status_code,'BYTES',len(r.content),flush=True)
              if r.status_code==200 and len(r.text)>1000: text=r.text; break
            except Exception as e: print('ERR',repr(e),flush=True)
          print('TEXT_LEN',len(text),flush=True)
          # Print compact contexts around code paths that construct condition objects/operators.
          pats=[r'queryType',r'DateRange',r'NumberRange',r'Numeric',r'operator',r'fieldOperator',r'condition',r'rules',r'\.type\s*=',r'type:',r'contains',r'equal',r'greater',r'less']
          seen=set()
          for pat in pats:
            hs=list(re.finditer(pat,text,re.I))
            print('\nPAT',pat,'HITS',len(hs),flush=True)
            for h in hs[:20]:
              a=max(0,h.start()-900); b=min(len(text),h.end()+1800)
              sn=re.sub(r'\s+',' ',text[a:b])
              key=sn[:250]
              if key in seen: continue
              seen.add(key)
              print(sn[:2800],flush=True)
          # Also surface string literals that look like short operator tokens.
          lits=re.findall(r'["\']([A-Za-z][A-Za-z0-9_<>!=.-]{0,24})["\']',text)
          cand=sorted(set(x for x in lits if any(k in x.lower() for k in ['eq','gt','lt','range','like','contain','between','date','num'])))
          print('\nCANDIDATE_LITERALS',cand,flush=True)
          PY
