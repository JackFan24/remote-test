name: fnz-ccer-treasury-search

on:
  push:
    paths:
      - '.github/workflows/fnz-ccer-treasury-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Enumerate treasury product views under 901201
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests,time
          base='https://www.ccerdata.cn'; lid='9012'; sid='901201'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept-Language':'zh-CN,zh;q=0.9'})
          s.get(base+'/login?target=/database',timeout=30)
          js=s.get(base+'/js/login.js',timeout=30).text
          m=re.search(r'postnologin=function\(\).*?post\(["\'](/login/signin)["\'],\{User:["\']([^"\']+)["\'],Password:["\']([^"\']+)["\']\}',js,re.S)
          if not m: raise SystemExit('anonymous flow not found')
          endpoint,user,pwd=m.groups()
          r=s.post(base+endpoint,data={'User':user,'Password':pwd},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
          print('ANON',r.status_code,r.text[:100],flush=True)
          print('CATALOG SEARCH',flush=True)
          for q in ['国债现货交易数据库','国债现货','国债交易']:
              rr=s.get(base+'/api/product/getsearch',params={'text':q,'page':1},headers={'X-Requested-With':'XMLHttpRequest'},timeout=30)
              print('Q',q,'HTTP',rr.status_code,'BODY',rr.text[:8000].replace('\n',' '),flush=True)
          print('\nVIEW ENUM',flush=True)
          found=[]
          for vid in range(9000,9061):
              try:
                  rr=s.get(base+'/product/getView',params={'id':vid,'sid':sid,'lid':lid},headers={'X-Requested-With':'XMLHttpRequest'},timeout=15)
                  if rr.status_code!=200: continue
                  try:v=rr.json()
                  except: continue
                  if not isinstance(v,dict) or not v: continue
                  full=str(v.get('fullName') or v.get('name') or '')
                  vsid=str(v.get('subLibraryId') or v.get('subLibraryID') or '')
                  fields=v.get('groupFields') or {}
                  nfields=sum(len(x) for x in fields.values() if isinstance(x,list)) if isinstance(fields,dict) else 0
                  if full or vsid or nfields:
                      rec={'vid':vid,'fullName':full,'subLibraryId':vsid,'startTime':v.get('startTime'),'endTime':v.get('endTime'),'total':v.get('total'),'authType':v.get('authType'),'previewDisabled':v.get('previewDisabled'),'groups':list(fields.keys()) if isinstance(fields,dict) else None,'nfields':nfields}
                      found.append(rec); print('VIEW',json.dumps(rec,ensure_ascii=False),flush=True)
              except Exception as e:
                  pass
              time.sleep(0.03)
          print('FOUND_N',len(found),flush=True)
          PY
