name: fnz-sse-000896-param-probe

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-000896-param-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe 2001 China Securities Journal static PDFs
        shell: bash
        run: |
          python - <<'PY'
          import requests
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://epaper.cs.com.cn/'})
          controls=['https://epaper.cs.com.cn/zgzqb/images/2005-07/09/B16/zgzqb20050709B16.pdf']
          for u in controls:
              try:
                  r=s.get(u,timeout=20,stream=True); head=next(r.iter_content(16),b'')
                  print('CONTROL',r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),head,flush=True)
              except Exception as e: print('CONTROL_ERR',repr(e),flush=True)
          for day in ['29','31']:
            date=f'2001-12/{day}'; ymd=f'200112{day}'
            for sec in ['A','B','C','D']:
              for n in range(1,33):
                page=f'{sec}{n:02d}'
                u=f'https://epaper.cs.com.cn/zgzqb/images/{date}/{page}/zgzqb{ymd}{page}.pdf'
                try:
                  r=s.get(u,timeout=8,stream=True)
                  ctype=(r.headers.get('content-type') or '').lower(); clen=r.headers.get('content-length')
                  head=next(r.iter_content(8),b'') if r.status_code==200 else b''
                  if r.status_code==200 and (b'%PDF' in head or 'pdf' in ctype):
                    print('FOUND',u,'CTYPE',ctype,'LEN',clen,'HEAD',head,flush=True)
                except Exception: pass
          PY
