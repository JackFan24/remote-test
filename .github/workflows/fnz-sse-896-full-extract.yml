name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download tgr.pdf over HTTP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests,os,hashlib
          u='http://efinance.org.cn/forum/tgr.pdf'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'http://efinance.org.cn/forum/Students%20Papers.htm'},timeout=45,allow_redirects=True)
          print('HTTP',r.status_code,'FINAL',r.url,'CTYPE',r.headers.get('content-type'),'BYTES',len(r.content),flush=True)
          print('HEAD',r.content[:16],flush=True)
          print('SHA256',hashlib.sha256(r.content).hexdigest(),flush=True)
          os.makedirs('out',exist_ok=True)
          open('out/tgr.pdf','wb').write(r.content)
          if r.status_code!=200 or not r.content.startswith(b'%PDF'):
              raise SystemExit('not a PDF')
          PY
      - name: Basic PDF text probe
        shell: bash
        run: |
          pdftotext -layout out/tgr.pdf out/tgr.txt || true
          echo PAGES=$(pdfinfo out/tgr.pdf 2>/dev/null | awk '/^Pages:/ {print $2}')
          echo TEXT_BYTES=$(wc -c < out/tgr.txt 2>/dev/null || echo 0)
          grep -a -n -E '000896|96国债|2001年8月30|2001-08-30|数据来源|色诺芬|交易日|附录' out/tgr.txt | head -100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tang-gerong-dissertation
          path: |
            out/tgr.pdf
            out/tgr.txt
