name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Extract exact SSE JJYQJ frontend query construction
        shell: bash
        run: |
          python - <<'PY'
          import re, requests
          urls=[
            'https://bond.sse.com.cn/xhtml/js/js_statistical.js',
            'https://bond.sse.com.cn/xhtml/js/area/statistics/js_statistical.js?v=20170516',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/data/statistics/Statistics/netfull/'})
          for u in urls:
            try:
              r=s.get(u,timeout=30)
              print('\nURL',u,'HTTP',r.status_code,'LEN',len(r.text),'FINAL',r.url,flush=True)
              js=r.text
            except Exception as e:
              print('ERR',u,repr(e),flush=True); continue
            for pat in ['js_insertJjyqj','insertJjyqj','COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L','JJYQJ','keywordsearch','tDate','commonQuery.do']:
              ms=list(re.finditer(re.escape(pat),js,re.I))
              print('PAT',pat,'COUNT',len(ms),flush=True)
              for i,m in enumerate(ms[:20]):
                a=max(0,m.start()-1800); b=min(len(js),m.end()+4000)
                print(f'--- {pat} #{i+1} ---',flush=True)
                print(js[a:b],flush=True)
          PY
