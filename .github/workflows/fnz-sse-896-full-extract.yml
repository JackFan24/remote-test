name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan SSE full result for 000896 / 96国债(8)
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import csv, json, requests
          url='https://query.sse.com.cn/commonQuery.do'
          params={'sqlId':'COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L','isPagination':'false'}
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.sse.com.cn/','Accept':'application/json,text/javascript,*/*;q=0.8'}
          rows=requests.get(url,params=params,headers=headers,timeout=90).json().get('result') or []
          print('ALL_ROWS',len(rows),flush=True)
          def blob(x): return json.dumps(x,ensure_ascii=False)
          scans={
            'name96':[x for x in rows if '96国债' in str(x.get('PRODUCTNAME',''))],
            'code896':[x for x in rows if '896' in str(x.get('PRODUCT',''))],
            'price_anchor':[x for x in rows if str(x.get('CLOSEPRICE','')).strip() in {'112.1','112.10'} and str(x.get('TOTAL_PRICE','')).strip()=='113.53'],
            'date_anchor':[x for x in rows if str(x.get('TXDATE','')).startswith('2001-12-31')],
            'year2001':[x for x in rows if str(x.get('TXDATE','')).startswith('2001-')],
          }
          for k,v in scans.items():
            print('\nSCAN',k,'COUNT',len(v),flush=True)
            for x in v[:100]: print(blob(x),flush=True)
            with open(f'out/{k}.json','w',encoding='utf-8') as f: json.dump(v,f,ensure_ascii=False,indent=2)
          # Joint textual scan across all field values.
          fuzzy=[]
          for x in rows:
            b=blob(x)
            if any(s in b for s in ['96国债','000896','"896"','112.10','113.53']): fuzzy.append(x)
          print('\nFUZZY_COUNT',len(fuzzy),flush=True)
          for x in fuzzy[:200]: print('FUZZY',blob(x),flush=True)
          with open('out/fuzzy.json','w',encoding='utf-8') as f: json.dump(fuzzy,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-sse-896-full-scan
          path: out/
