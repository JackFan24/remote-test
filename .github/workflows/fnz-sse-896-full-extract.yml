name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect SSE net-full page scripts and query construction
        shell: bash
        run: |
          python - <<'PY'
          import re, requests, urllib.parse
          pages=[
            'https://bond.sse.com.cn/data/statistics/Statistics/netfull/',
            'https://bond.sse.com.cn/data/statistics/Statistics/netfull/index_his.shtml',
            'https://www.sse.com.cn/market/bonddata/netfull/index_his.shtml',
          ]
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/'})
          for page in pages:
            print('\nPAGE',page,flush=True)
            r=s.get(page,timeout=30); print('HTTP',r.status_code,'BYTES',len(r.content),'FINAL',r.url,flush=True)
            html=r.text
            for line in html.splitlines():
              if any(k in line for k in ['script','sqlId','commonQuery','queryDate','securityCode','netfull','SSEBOND']):
                print('HTML',line[:3000],flush=True)
            srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
            for src in srcs:
              u=urllib.parse.urljoin(r.url,src)
              try:
                js=s.get(u,timeout=30).text
              except Exception as e:
                print('JSERR',u,e,flush=True); continue
              hit=any(k in js for k in ['COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L','commonQuery.do','queryDate','securityCode'])
              if hit:
                print('\nJS_HIT',u,'LEN',len(js),flush=True)
                for pat in ['COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L','commonQuery.do','queryDate','securityCode','sqlId']:
                  for m in list(re.finditer(re.escape(pat),js,re.I))[:10]:
                    a=max(0,m.start()-800); b=min(len(js),m.end()+1600)
                    print('CTX',pat,js[a:b].replace('\n',' ')[:3500],flush=True)
          PY
