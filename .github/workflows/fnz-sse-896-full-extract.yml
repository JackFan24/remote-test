name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Identify legacy date bind params
        shell: bash
        run: |
          python - <<'PY'
          import json,re,requests
          base='https://query.sse.com.cn/commonQuery.do'
          sql='COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/data/statistics/Statistics/netfull/index_his.shtml','Accept':'application/json,text/javascript,*/*;q=0.8'})
          def parse(t):
            try:return json.loads(t)
            except: pass
            m=re.search(r'^[^(]*\((.*)\)\s*;?\s*$',t,re.S)
            if m:
              try:return json.loads(m.group(1))
              except:return None
          tests=[
            ('START_END_hyphen', {'START_DATE':'2001-12-31','END_DATE':'2001-12-31'}),
            ('START_END_compact', {'START_DATE':'20011231','END_DATE':'20011231'}),
            ('BEGIN_END_hyphen', {'BEGIN_DATE':'2001-12-31','END_DATE':'2001-12-31'}),
            ('TRADE_DATE_hyphen', {'TRADE_DATE':'2001-12-31'}),
            ('DATE_hyphen', {'DATE':'2001-12-31'}),
            ('TXDATE_compact', {'TXDATE':'20011231'}),
          ]
          for name,x in tests:
            p={'isPagination':'true','pageHelp.pageSize':'100','sqlId':sql,**x}
            r=s.get(base,params=p,timeout=30); j=parse(r.text)
            rows=[]
            if isinstance(j,dict): rows=j.get('result') or ((j.get('pageHelp') or {}).get('data')) or []
            dates=sorted({str(z.get('TXDATE') or z.get('TRADE_DATE') or '') for z in rows})
            hits=[z for z in rows if any(q in json.dumps(z,ensure_ascii=False) for q in ['000896','96国债','国债⑻','国债(8)','国债（8）'])]
            print('\nTEST',name,'HTTP',r.status_code,'ROWS',len(rows),'DATES',dates[:3],dates[-3:],flush=True)
            print('HITS',json.dumps(hits,ensure_ascii=False)[:5000],flush=True)
            if rows: print('FIRST',json.dumps(rows[0],ensure_ascii=False)[:1500],flush=True)
          PY
