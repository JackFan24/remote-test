name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe efinance student-paper archive
        shell: bash
        run: |
          python - <<'PY'
          import re,requests,urllib.parse
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0'})
          urls=[
            'https://efinance.org.cn/forum/Students%20Papers.htm',
            'http://efinance.org.cn/forum/Students%20Papers.htm',
            'https://www.efinance.org.cn/forum/Students%20Papers.htm',
          ]
          for u in urls:
            try:
              r=s.get(u,timeout=30); text=r.text
              print('\nPAGE',u,'HTTP',r.status_code,'FINAL',r.url,'LEN',len(text),flush=True)
              for needle in ['唐革榕','静态拟合','利率期限结构','Tang']:
                for m in list(re.finditer(needle,text,re.I))[:10]:
                  print('HIT',needle,text[max(0,m.start()-1000):m.end()+1800].replace('\n',' ')[:3000],flush=True)
              for href,label in re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',text,re.I|re.S):
                lab=re.sub('<[^>]+>','',label)
                if any(k in (lab+href) for k in ['唐革榕','静态拟合','利率期限结构','tgr','TGR','tang']):
                  print('LINK',lab.strip(),urllib.parse.urljoin(r.url,href),flush=True)
            except Exception as e: print('ERR',u,repr(e),flush=True)
          # Test a small set of filename candidates only after archive page probe.
          for fn in ['tgr.pdf','TGR.pdf','tanggr.pdf','tanggerong.pdf']:
            u='https://efinance.org.cn/forum/'+fn
            try:
              r=s.get(u,timeout=15,stream=True); head=next(r.iter_content(8),b'')
              print('CAND',fn,'HTTP',r.status_code,'CTYPE',r.headers.get('content-type'),'LEN',r.headers.get('content-length'),'HEAD',head,flush=True)
            except Exception as e: print('CAND_ERR',fn,repr(e),flush=True)
          PY
