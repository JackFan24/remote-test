name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe NetEase historical CSV for old treasury bonds
        shell: bash
        run: |
          python - <<'PY'
          import requests
          base='https://quotes.money.163.com/service/chddata.html'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://quotes.money.163.com/'})
          tests=[
            ('target_2001','0000896','20010830','20011231'),
            ('control_696_2001','0000696','20010830','20011231'),
            ('target_2002','0000896','20020104','20020301'),
            ('target_2000','0000896','20000601','20001229'),
          ]
          for name,code,start,end in tests:
            try:
              r=s.get(base,params={'code':code,'start':start,'end':end,'fields':'TCLOSE;HIGH;LOW;TOPEN;LCLOSE;CHG;PCHG;VOTURNOVER;VATURNOVER'},timeout=30,allow_redirects=True)
              raw=r.content
              print('\nTEST',name,'HTTP',r.status_code,'FINAL',r.url,'BYTES',len(raw),'CTYPE',r.headers.get('content-type'),flush=True)
              text=None
              for enc in ['gb18030','gbk','utf-8']:
                try:
                  text=raw.decode(enc); print('ENC',enc,flush=True); break
                except: pass
              if text is None: text=raw.decode('utf-8','replace')
              lines=[x for x in text.splitlines() if x.strip()]
              print('LINES',len(lines),flush=True)
              for ln in lines[:6]: print('HEADROW',ln[:1000],flush=True)
              if len(lines)>6:
                for ln in lines[-4:]: print('TAILROW',ln[:1000],flush=True)
            except Exception as e:
              print('ERR',name,repr(e),flush=True)
          PY
