name: fnz-sse-896-full-extract

on:
  push:
    paths:
      - '.github/workflows/fnz-sse-896-full-extract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect historical net-full page scripts
        shell: bash
        run: |
          python - <<'PY'
          import re,requests,urllib.parse
          page='https://bond.sse.com.cn/data/statistics/Statistics/netfull/index_his.shtml'
          h={'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/'}
          s=requests.Session(); s.headers.update(h)
          r=s.get(page,timeout=30); html=r.text
          print('PAGE HTTP',r.status_code,'LEN',len(html),'FINAL',r.url,flush=True)
          srcs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I):
            u=urllib.parse.urljoin(r.url,src); srcs.append(u); print('SRC',u,flush=True)
          for i,m in enumerate(re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.I|re.S),1):
            t=m.group(1).strip()
            if t and any(k.lower() in t.lower() for k in ['sql','query','j jyqj'.replace(' ',''),'netfull','date','type']):
              print('\nINLINE',i,t[:10000].replace('\n',' '),flush=True)
          print('\n--- TARGETED SCRIPT CONTENT ---',flush=True)
          for u in srcs:
            if not any(k in u.lower() for k in ['statistical','netfull','special','area/statistics','bond']):
              continue
            try:
              rr=s.get(u,timeout=30); js=rr.text
              print('\nJS',u,'HTTP',rr.status_code,'LEN',len(js),flush=True)
            except Exception as e:
              print('JSERR',u,repr(e),flush=True); continue
            for needle in ['COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L','JJYQJ_CX','index_his','js_insertJjyqj','SEARCH_DATE','SEC_CODE','TXDATE','PRODUCT','TYPE']:
              low=js.lower(); pos=low.find(needle.lower())
              if pos>=0:
                print('\nHIT',needle,'AT',pos,flush=True)
                print(js[max(0,pos-1800):min(len(js),pos+len(needle)+4500)],flush=True)
          PY
