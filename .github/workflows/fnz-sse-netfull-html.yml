name: fnz-sse-netfull-html
on:
  push:
    paths:
      - '.github/workflows/fnz-sse-netfull-html.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print RequireJS calls and page tail
        shell: bash
        run: |
          python - <<'PY'
          import re,requests
          u='https://bond.sse.com.cn/data/statistics/Statistics/netfull/'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/'},timeout=30)
          html=r.text
          print('HTTP',r.status_code,'LEN',len(html),flush=True)
          for m in re.finditer(r'require\s*\(',html,re.I):
              a=max(0,m.start()-500); b=min(len(html),m.start()+4000)
              print('\nREQUIRE_CTX',html[a:b].replace('\n',' ')[:4500],flush=True)
          print('\nHTML_TAIL',html[-12000:].replace('\n',' ')[:12000],flush=True)
          PY
