name: fnz-sse-official-sweep-2001
on:
  push:
    branches: [fnz-gap-audit-20260913]
    paths: ['.github/workflows/fnz-sse-official-sweep-2001.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sweep SSE official net/full API for 2001 gap
        shell: bash
        run: |
          python -m pip install -q requests pandas
          python - <<'PY'
          import os,json,time,requests,pandas as pd
          from concurrent.futures import ThreadPoolExecutor, as_completed
          os.makedirs('out',exist_ok=True)
          url='https://query.sse.com.cn/commonQuery.do'
          sql='COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_JJYQJ_CX_L'
          dates=pd.date_range('2001-08-30','2001-12-31',freq='D').strftime('%Y-%m-%d').tolist()
          def one(d):
            s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/data/statistics/Statistics/netfull/index_his.shtml','Accept':'*/*'})
            p={'jsonCallBack':'jsonpCallback123456','isPagination':'true','pageHelp.pageSize':'500','pageHelp.beginPage':'1','pageHelp.endPage':'1','pageHelp.cacheSize':'1','sqlId':sql,'TRADE_DATE':d,'BOND_TYPE':'记账式国债'}
            for attempt in range(3):
              try:
                r=s.get(url,params=p,timeout=15); txt=r.text.strip()
                if txt.startswith('jsonpCallback'): txt=txt[txt.find('(')+1:txt.rfind(')')]
                j=json.loads(txt); rows=j.get('result') or []
                return d,r.status_code,rows,''
              except Exception as e:
                if attempt==2: return d,'ERR',[],repr(e)
                time.sleep(0.5*(attempt+1))
          out=[]; summ=[]
          with ThreadPoolExecutor(max_workers=6) as ex:
            futs={ex.submit(one,d):d for d in dates}
            for fut in as_completed(futs):
              d,status,rows,err=fut.result()
              hit=[x for x in rows if str(x.get('PRODUCT','')).zfill(6)=='000896']
              summ.append({'date':d,'status':status,'rows':len(rows),'has_000896':bool(hit),'error':err})
              for x in rows:
                x=dict(x); x['_query_date']=d; out.append(x)
          sdf=pd.DataFrame(summ).sort_values('date'); sdf.to_csv('out/daily_summary.csv',index=False,encoding='utf-8-sig')
          df=pd.DataFrame(out)
          if len(df):
            df=df.sort_values(['_query_date','NUM'] if 'NUM' in df else ['_query_date']); df.to_csv('out/all_official_rows.csv',index=False,encoding='utf-8-sig')
            hits=df[df['PRODUCT'].astype(str).str.zfill(6).eq('000896')].copy(); hits.to_csv('out/000896_official_2001.csv',index=False,encoding='utf-8-sig')
            print('000896 hits',len(hits),'first',hits['_query_date'].min() if len(hits) else None,'last',hits['_query_date'].max() if len(hits) else None)
            if len(hits): print(hits[['_query_date','PRODUCT','CLOSEPRICE','INTEREST','TOTAL_PRICE']].to_string(index=False))
          print('dates with any rows',int((sdf.rows>0).sum()),'of',len(sdf))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-sse-official-sweep-2001-results
          path: out/
