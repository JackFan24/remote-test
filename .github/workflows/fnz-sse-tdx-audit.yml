name: fnz-sse-tdx-audit
on:
  push:
    branches: [fnz-gap-audit-20260913]
    paths: ['.github/workflows/fnz-sse-tdx-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe SSE historical endpoint and TDX
        shell: bash
        run: |
          python -m pip install -q requests beautifulsoup4 pytdx pandas
          python - <<'PY'
          import os,re,json,requests,pandas as pd
          from bs4 import BeautifulSoup
          os.makedirs('out',exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/'})
          summary=[]
          def rec(name,status='',rows='',first='',last='',note=''):
              summary.append(dict(name=name,status=status,rows=rows,first=first,last=last,note=note))
          # SSE page source + scripts
          try:
              u='https://bond.sse.com.cn/data/statistics/Statistics/netfull/index_his.shtml'
              r=s.get(u,timeout=30); open('out/sse_netfull_page.html','w',encoding='utf-8').write(r.text)
              rec('sse_netfull_page',r.status_code,note='len='+str(len(r.text)))
              soup=BeautifulSoup(r.text,'html.parser')
              scripts=[]
              for tag in soup.find_all('script'):
                  src=tag.get('src')
                  if src:
                      if src.startswith('//'): src='https:'+src
                      elif src.startswith('/'): src='https://bond.sse.com.cn'+src
                      elif not src.startswith('http'): src=requests.compat.urljoin(u,src)
                      scripts.append(src)
              open('out/sse_scripts.txt','w').write('\n'.join(scripts))
              hits=[]
              for i,src in enumerate(scripts):
                  try:
                      rr=s.get(src,timeout=30); txt=rr.text
                      open(f'out/script_{i}.js','w',encoding='utf-8').write(txt)
                      if re.search(r'netfull|query|ajax|json|Statistics',txt,re.I):
                          for m in re.finditer(r'.{0,180}(?:netfull|query|ajax|json).{0,240}',txt,re.I|re.S):
                              hits.append(src+'\n'+m.group(0).replace('\n',' ')+'\n')
                  except Exception as e: hits.append(src+' ERROR '+repr(e))
              open('out/sse_script_hits.txt','w',encoding='utf-8').write('\n'.join(hits))
              rec('sse_scripts','ok',len(scripts),note='hits='+str(len(hits)))
          except Exception as e: rec('sse_page_probe','error',note=repr(e))
          # pytdx direct daily bars for SH 000896
          try:
              from pytdx.hq import TdxHq_API
              from pytdx.config.hosts import hq_hosts
              found=[]; conn=[]
              for h in hq_hosts[:20]:
                  host=h[1]; port=h[2]
                  api=TdxHq_API(raise_exception=False,auto_retry=True)
                  try:
                      ok=api.connect(host,port,time_out=1.5)
                      if not ok: continue
                      conn.append(f'{host}:{port}')
                      # daily category 9; request several offsets
                      allbars=[]
                      for start in [0,800,1600,2400,3200,4000,4800,5600]:
                          arr=api.get_security_bars(9,1,'000896',start,800) or []
                          allbars.extend(arr)
                      if allbars:
                          df=pd.DataFrame(allbars).drop_duplicates(subset=['datetime']).sort_values('datetime')
                          df.to_csv('out/tdx_sh000896_all.csv',index=False,encoding='utf-8-sig')
                          x=df[(df['datetime']>='2001-08-30')&(df['datetime']<='2001-12-31')]
                          x.to_csv('out/tdx_sh000896_2001gap.csv',index=False,encoding='utf-8-sig')
                          found.append((host,port,len(df),len(x),df['datetime'].min(),df['datetime'].max()))
                          api.disconnect(); break
                      api.disconnect()
                  except Exception:
                      try: api.disconnect()
                      except: pass
              open('out/tdx_connections.txt','w').write('\n'.join(conn))
              rec('tdx_sh000896','ok' if found else 'no_data',found[0][2] if found else 0,found[0][4] if found else '',found[0][5] if found else '',str(found[:3]))
          except Exception as e: rec('tdx_sh000896','error',note=repr(e))
          pd.DataFrame(summary).to_csv('out/summary.csv',index=False,encoding='utf-8-sig')
          print(pd.DataFrame(summary).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-sse-tdx-audit-results
          path: out/
