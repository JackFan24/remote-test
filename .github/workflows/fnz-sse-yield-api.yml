name: fnz-sse-yield-api
on:
  push:
    branches: [fnz-gap-audit-20260913]
    paths: ['.github/workflows/fnz-sse-yield-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  y:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect SSE yield historical API
        shell: bash
        run: |
          python -m pip install -q requests beautifulsoup4
          python - <<'PY'
          import os,re,requests
          os.makedirs('out',exist_ok=True)
          u='https://bond.sse.com.cn/data/statistics/Statistics/yield/index_his.shtml'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':u})
          r=s.get(u,timeout=20); open('out/page.html','w',encoding='utf-8').write(r.text)
          lines=r.text.splitlines(); hits=[]
          for i,line in enumerate(lines):
            if re.search(r'sqlId|commonQuery|headers_data|TRADE|DATE|BOND|PRODUCT|PRICE|YIELD|PROFIT',line,re.I):
              hits.extend(lines[max(0,i-2):min(len(lines),i+4)])
          open('out/hits.txt','w',encoding='utf-8').write('\n'.join(hits))
          print('\n'.join(hits[:300]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-sse-yield-api-results
          path: out/
