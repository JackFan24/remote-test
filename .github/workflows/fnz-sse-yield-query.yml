name: fnz-sse-yield-query
on:
  push:
    branches: [fnz-gap-audit-20260913]
    paths: ['.github/workflows/fnz-sse-yield-query.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query SSE official yield-price endpoint
        shell: bash
        run: |
          python -m pip install -q requests pandas
          python - <<'PY'
          import os,json,requests,pandas as pd
          os.makedirs('out',exist_ok=True)
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://bond.sse.com.cn/data/statistics/Statistics/yield/index_his.shtml','Accept':'*/*'})
          url='https://query.sse.com.cn/commonQuery.do'; sql='COMMON_SSEBOND_SCSJ_SCTJ_ZXTJ_ZQSYLTJ_CX_L'
          dates=['2001-08-30','2001-09-03','2001-10-31','2001-11-01','2001-11-02','2001-12-03','2001-12-28','2001-12-31','2002-01-04','2002-02-28']
          out=[]; summ=[]
          for d in dates:
            p={'jsonCallBack':'jsonpCallback123456','isPagination':'true','pageHelp.pageSize':'500','pageHelp.beginPage':'1','pageHelp.endPage':'1','pageHelp.cacheSize':'1','sqlId':sql,'TRADE_DATE':d,'BOND_CODE':'000896'}
            try:
              r=s.get(url,params=p,timeout=20); txt=r.text.strip()
              if txt.startswith('jsonpCallback'): txt=txt[txt.find('(')+1:txt.rfind(')')]
              j=json.loads(txt); rows=j.get('result') or []
              summ.append({'date':d,'status':r.status_code,'rows':len(rows)})
              for x in rows: x=dict(x); x['_query_date']=d; out.append(x)
            except Exception as e: summ.append({'date':d,'status':'ERR','rows':0,'error':repr(e)})
          pd.DataFrame(summ).to_csv('out/summary.csv',index=False,encoding='utf-8-sig'); pd.DataFrame(out).to_csv('out/rows.csv',index=False,encoding='utf-8-sig')
          print(pd.DataFrame(summ).to_string(index=False)); print(pd.DataFrame(out).to_string(index=False) if out else 'no rows')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fnz-sse-yield-query-results
          path: out/
